# n8n: https://n8n.io
x-portdock:
  name: n8n
  description: "Workflow automation with 400+ integrations, backed by PostgreSQL."
  category: Low-code & Automation
  website: https://n8n.io
  tags: [automation, workflows, integrations]
  service: n8n
  port: 5678
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${PORTDOCK_FQDN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${PORTDOCK_URL}/
      N8N_ENCRYPTION_KEY: ${PORTDOCK_SECRET_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${PORTDOCK_PASSWORD_DB}
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${PORTDOCK_PASSWORD_DB}
      POSTGRES_DB: n8n
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10
volumes:
  n8n-data:
  pg-data:
