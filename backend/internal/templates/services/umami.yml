# Umami: https://umami.is
x-portdock:
  name: Umami
  description: "Privacy-focused, GDPR compliant web analytics."
  category: Analytics & BI
  website: https://umami.is
  tags: [analytics, web, privacy]
  service: umami
  port: 3000
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${PORTDOCK_PASSWORD_DB}@postgres:5432/umami
      APP_SECRET: ${PORTDOCK_SECRET_APP}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${PORTDOCK_PASSWORD_DB}
      POSTGRES_DB: umami
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      retries: 10
volumes:
  pg-data:
