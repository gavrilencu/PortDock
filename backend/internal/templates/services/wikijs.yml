# Wiki.js: https://js.wiki
x-portdock:
  name: Wiki.js
  description: "Modern wiki with a Markdown editor, search, access control and SSO (LDAP, OIDC, SAML), backed by PostgreSQL. The first visit creates the administrator."
  category: Collaboration & Productivity
  website: https://js.wiki
  tags: [wiki, documentation, knowledge-base]
  service: wiki
  port: 3000
services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: wikijs
      DB_PASS: ${PORTDOCK_PASSWORD_DB}
      DB_NAME: wiki
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${PORTDOCK_PASSWORD_DB}
      POSTGRES_DB: wiki
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 5s
      retries: 10
volumes:
  pg-data:
