# Uptime Kuma: https://uptime.kuma.pet
x-portdock:
  name: Uptime Kuma
  description: "Self-hosted uptime monitoring with status pages."
  category: Monitoring & Observability
  website: https://uptime.kuma.pet
  tags: [monitoring, uptime, status-page]
