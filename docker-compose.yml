# Runs PortDock on this machine. The machine itself becomes the "localhost" server.
services:
  portdock:
    build:
      context: .
      args:
        VERSION: ${PORTDOCK_VERSION:-dev}
        UPDATE_REPO: ${PORTDOCK_UPDATE_REPO:-}
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
    # Set PORTDOCK_IMAGE=ghcr.io/<owner>/<repo>:vX.Y.Z to run a published release
    # instead of building locally; in-app updates replace the container in place.
    image: ${PORTDOCK_IMAGE:-portdock:latest}
    container_name: portdock
    restart: unless-stopped
    ports:
      # Host port of the dashboard (PORTDOCK_PORT, default 8000).
      - "${PORTDOCK_PORT:-8000}:8000"
    environment:
      # External URL of the dashboard (used to build webhook URLs).
      PORTDOCK_PUBLIC_URL: ${PORTDOCK_PUBLIC_URL:-http://localhost:8000}
      PORTDOCK_MAX_BUILDS: ${PORTDOCK_MAX_BUILDS:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Must be mounted at the SAME path as on the host: builds and backups
      # are bind-mounted into helper containers by absolute host path.
      - /data/portdock:/data/portdock
    # Optional: serve the dashboard through Traefik with HTTPS once the proxy runs.
    # networks: [portdock]
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.portdock.rule: Host(`portdock.example.com`)
    #   traefik.http.routers.portdock.entrypoints: websecure
    #   traefik.http.routers.portdock.tls.certresolver: letsencrypt
    #   traefik.http.services.portdock.loadbalancer.server.port: "8000"
